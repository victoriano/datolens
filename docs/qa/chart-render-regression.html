<!doctype html><html><head><meta charset="utf-8"><title>Datolens selective chart rendering</title><style>html,body,#root{margin:0;width:100%;height:100%}#report{position:fixed;right:12px;bottom:12px;z-index:1000;background:white;color:#222;padding:12px;border:1px solid #999;max-width:560px;font:12px monospace;white-space:pre-wrap;pointer-events:none}</style>
<script>
// Development-only React commit instrumentation. PerformedWork is bit 1 in the installed React 19 renderer.
window.__renderMetrics={};
const previousRoots=new WeakMap();
window.__REACT_DEVTOOLS_GLOBAL_HOOK__={supportsFiber:true,renderers:new Map(),inject(renderer){this.renderers.set(1,renderer);return 1;},onCommitFiberUnmount:()=>{},onCommitFiberRoot:(_id,root)=>{
  const previous=previousRoots.get(root)||new Set(),next=new Set();
  function visit(fiber){if(!fiber)return;next.add(fiber);
    const name=typeof fiber.type==='function'?fiber.type.name.replace(/\d+$/,''):'';
    if(!previous.has(fiber)&&(fiber.flags&1)&&['Histogram','VariableChart','CategoryBars','CategoryBar','Canvas'].includes(name)){
      let parent=fiber,column='';while(parent){column=parent.memoizedProps?.['data-reorder-id']||parent.memoizedProps?.column?.id||'';if(column)break;parent=parent.return;}
      if(name==='Canvas')column=fiber.memoizedProps.rows[0]?.series||'chart';
      const key=name+':'+column+(name==='CategoryBar'?':'+String(fiber.memoizedProps.bin.value):'');
      window.__renderMetrics[key]=(window.__renderMetrics[key]||0)+1;
    }
    visit(fiber.child);visit(fiber.sibling);
  }visit(root.current);previousRoots.set(root,next);
}};
</script></head><body><div id="root"></div><pre id="report">Running selective chart regression…</pre><script type="module" src="./chart-render-regression.tsx"></script></body></html>
