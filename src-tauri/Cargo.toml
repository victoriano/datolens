[package]
name = "datolens"
version = "0.1.0"
edition = "2021"

[lib]
name = "datolens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = "3"
datolens-data = { path = "crates/datolens-data" }
datolens-enrichment = { path = "crates/datolens-enrichment" }

[workspace]
exclude = ["crates/datolens-data", "crates/datolens-enrichment"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[dev-dependencies]
tempfile = "3"
