[package]
name = "datolens-data"
version = "0.1.0"
edition = "2021"

[dependencies]
duckdb = "=1.10505.0"
calamine = { version = "0.36", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
ambers = "=0.4.4"
arrow = { version = "57", default-features = false }
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

[dev-dependencies]
rust_xlsxwriter = "0.93"
